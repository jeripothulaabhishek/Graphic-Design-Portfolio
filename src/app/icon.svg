<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#090909"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC800"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>
  </defs>

  <!-- Background Circle / Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="#FFB800" stroke-width="8" stroke-opacity="0.3"/>

  <!-- Crown Mark Accent -->
  <path d="M 196 140 L 226 180 L 256 130 L 286 180 L 316 140 L 306 200 L 206 200 Z" fill="url(#goldGrad)" />

  <!-- Bold Monogram "A" -->
  <text x="256" y="380" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="220" fill="#FFFFFF" letter-spacing="-6">A</text>

  <!-- Gold Accent Pill Dot -->
  <circle cx="360" cy="360" r="24" fill="#FFB800"/>
</svg>
